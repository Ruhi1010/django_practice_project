{% extends "layout.html" %}


{% block title %}
    Ruhi Practice Hub | Tweet App
{% endblock title %}
    

{% block content %}
<style>
  :root {
    --paper: #f6f1e4;
    --paper-raised: #fbf8ef;
    --ink: #26241d;
    --ink-soft: #6b6555;
    --rule: #d8cdb2;
    --accent: #bf3d1c;
    --accent-ink: #fdf6ea;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #242019;
      --paper-raised: #2d2820;
      --ink: #f1ead9;
      --ink-soft: #b9ae95;
      --rule: #4a4331;
      --accent: #e3703c;
      --accent-ink: #241a12;
    }
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: ui-monospace, "SFMono-Regular", "Space Mono", Menlo, Consolas, monospace;
  }

  
  /* Navbar */
  .navbar {
    background: var(--ink) !important;
    border-bottom: 2px solid var(--accent);
    padding: 14px 24px;
  }

  .navbar-brand {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-style: italic;
    color: var(--paper) !important;
    font-size: 1.3rem;
  }

  .navbar .nav-link {
    color: var(--paper) !important;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .navbar .nav-link:hover {
    color: var(--accent) !important;
  }

  .navbar .nav-link.disabled {
    color: var(--ink-soft) !important;
  }

  .navbar .dropdown-menu {
    background: var(--paper-raised);
    border: 1px solid var(--ink);
    border-radius: 0;
  }

  .navbar .dropdown-item {
    color: var(--ink);
    font-size: 0.85rem;
  }

  .navbar .dropdown-item:hover {
    background: var(--accent);
    color: var(--accent-ink);
  }

  .navbar .form-control {
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 0;
    color: var(--ink);
    font-family: inherit;
  }

  .navbar .form-control::placeholder {
    color: var(--ink-soft);
  }

  .navbar .btn-outline-success {
    border: 1px solid var(--accent);
    border-radius: 0;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.8rem;
  }

  .navbar .btn-outline-success:hover {
    background: var(--accent);
    color: var(--accent-ink);
  }




  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.5rem);
    letter-spacing: -0.01em;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 20px;
    margin-bottom: 32px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  h2 {
    font-family: Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 1.3rem;
    max-width: 560px;
    margin: 0 auto 18px;
    background: var(--paper-raised);
    border: 1px solid var(--ink);
    box-shadow: 7px 7px 0 var(--accent);
    padding: 30px 28px 26px;
  }

  form p {
    margin: 0 0 18px;
  }

  form label {
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  form textarea {
    width: 100%;
    min-height: 200px;
    background: repeating-linear-gradient(
      var(--paper-raised) 0px,
      var(--paper-raised) 27px,
      var(--rule) 28px
    );
    background-attachment: local;
    border: 1px solid var(--rule);
    border-radius: 0;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 1.05rem;
    line-height: 28px;
    padding: 4px 12px;
    resize: vertical;
  }

  form input[type="text"],
  form input[type="url"],
  form input[type="email"] {
    width: 100%;
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 0;
    color: var(--ink);
    font-family: Georgia, serif;
    font-size: 1.05rem;
    padding: 10px 12px;
  }

  form input[type="file"] {
    font-size: 0.8rem;
    color: var(--ink-soft);
    max-width: 100%;
  }

  form input[type="file"]::file-selector-button {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    margin-right: 12px;
  }

  form input[type="file"]::file-selector-button:hover {
    background: var(--ink);
    color: var(--paper-raised);
  }

  form textarea:focus-visible,
  form input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .errorlist {
    list-style: none;
    margin: 0 0 8px;
    padding: 0;
    color: var(--accent);
    font-size: 0.78rem;
  }

  .btn-warning {
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--ink);
    border-radius: 0;
    padding: 12px 26px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.03em;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .btn-warning:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--ink);
    color: var(--accent-ink);
  }

  .btn-warning:active {
    transform: translate(1px, 1px);
    box-shadow: 2px 2px 0 var(--ink);
  }

  h2 > a {
    display: inline-block;
    margin-top: 20px;
    color: var(--ink-soft);
    font-size: 0.8rem;
    font-style: normal;
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 4px;
  }

  h2 > a:hover {
    color: var(--accent);
  }
</style>



    <h1 class="text-center mt-4">Welcome to Ruhi Practice Hub</h1>
    <h2>
        {% if form.instance.pk %} 
        Edit Tweet 
        {% else %} 
        Create Tweet 
        {% endif %}
        <form method="POST" enctype="multipart/form-data" class="form">
            {% csrf_token %}
            {{form.as_p}}
            <button class="btn btn-warning" type="submit">Submit</button>
        </form>
        <a href="{% url 'tweet_list' %}">Back to Tweet</a>
    </h2>
{% endblock %}
